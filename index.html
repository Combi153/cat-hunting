<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta
      name="description"
      content="수능 시험실을 직접 걸으며 학생을 살피는 3D 클레이 감독 게임, 냥이잡기."
    />
    <link rel="icon" type="image/svg+xml" href="/cat.svg" />
    <title>냥이잡기</title>
  </head>
  <body>
    <div id="game">
      <main id="lobby"></main>
      <section id="play" aria-label="시험 감독" hidden>
        <div id="play-header"></div>
        <div id="viewfinder">
          <canvas id="room" aria-label="3D 시험실. 학생을 눌러 다가가거나 화면을 쓸어 둘러보세요."></canvas>
          <div id="hud">
            <span id="target-marker" aria-hidden="true" hidden></span>
            <div class="alerts">
              <div id="tasks"></div>
              <div id="feedback"></div>
            </div>
          </div>
          <div id="notice" role="status"></div>
        </div>
        <div class="controls">
          <div id="context"></div>
          <div id="touch">
            <div class="move-pad">
              <div id="stick" aria-label="이동 조이스틱">
                <i></i><span aria-hidden="true">▴</span><span aria-hidden="true">▸</span
                ><span aria-hidden="true">▾</span><span aria-hidden="true">◂</span>
              </div>
              <span class="pad-label" id="gait">이동</span>
            </div>
            <button id="leave-seat" data-action="unfocus" aria-label="관찰 끝내기">
              <span aria-hidden="true">↩</span>돌아가기
            </button>
            <button
              id="touch-action"
              data-action="action"
              aria-keyshortcuts="E"
              title="상호작용 (키보드 E)"
              disabled
            >
              <span class="action-caption"
                ><small id="action-target">상호작용</small><strong id="action-verb">다가가세요</strong></span
              >
              <span class="action-key" aria-hidden="true">A</span>
            </button>
          </div>
        </div>
      </section>
      <div id="overlay" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
