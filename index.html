<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta
      name="description"
      content="수능 시험실을 직접 걸으며 학생을 살피는 3D 클레이 감독 게임, 냥이잡기."
    />
    <link rel="icon" type="image/svg+xml" href="/cat.svg" />
    <title>냥이잡기</title>
  </head>
  <body>
    <div id="game">
      <main id="lobby"></main>
      <section id="play" aria-label="시험 감독" hidden>
        <div id="play-header"></div>
        <div id="viewfinder">
          <canvas id="room" aria-label="3D 시험실. 학생을 눌러 다가가거나 화면을 쓸어 둘러보세요."></canvas>
          <div id="hud">
            <button id="seat-marker" data-action="action" hidden></button>
            <div class="alerts">
              <div id="tasks"></div>
              <div id="feedback"></div>
            </div>
          </div>
          <div id="notice" role="status"></div>
        </div>
        <div class="controls">
          <div id="touch">
            <div class="move-pad">
              <div id="stick" aria-label="이동 조이스틱">
                <i></i><span aria-hidden="true">▴</span><span aria-hidden="true">▸</span
                ><span aria-hidden="true">▾</span><span aria-hidden="true">◂</span>
              </div>
              <span class="pad-label">이동</span>
            </div>
            <div class="thumb-actions">
              <button data-action="quiet" aria-pressed="false">조용히 걷기</button>
              <button id="touch-action" data-action="action" disabled></button>
            </div>
          </div>
          <div id="context"></div>
        </div>
      </section>
      <div id="overlay" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
