<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta
      name="description"
      content="누가 몰래 정답을 보고 있을까요? 시험 감독이 되어 45초 안에 부정행위를 모두 찾아내세요."
    />
    <link rel="canonical" href="https://cat-hunting.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="냥이잡기" />
    <meta property="og:title" content="냥이잡기 · 45초 시험 감독" />
    <meta
      property="og:description"
      content="누가 몰래 정답을 보고 있을까요? 시험 감독이 되어 45초 안에 부정행위를 모두 찾아내세요."
    />
    <meta property="og:url" content="https://cat-hunting.vercel.app/" />
    <meta property="og:image" content="https://cat-hunting.vercel.app/art/exam-keyart.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1672" />
    <meta property="og:image:height" content="941" />
    <meta property="og:image:alt" content="점토 교실에서 시험을 보며 안경을 고쳐 쓰는 학생과 감독관" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="냥이잡기 · 45초 시험 감독" />
    <meta
      name="twitter:description"
      content="누가 몰래 정답을 보고 있을까요? 시험 감독이 되어 45초 안에 부정행위를 모두 찾아내세요."
    />
    <meta name="twitter:image" content="https://cat-hunting.vercel.app/art/exam-keyart.jpg" />
    <meta name="twitter:image:alt" content="점토 교실에서 시험을 보며 안경을 고쳐 쓰는 학생과 감독관" />
    <link rel="icon" type="image/svg+xml" href="/cat.svg" />
    <title>냥이잡기</title>
  </head>
  <body>
    <div id="game">
      <main id="lobby"></main>
      <section id="play" aria-label="시험 감독" hidden>
        <div id="play-header"></div>
        <div id="viewfinder">
          <canvas id="room" aria-label="3D 시험실"></canvas>
          <div id="seat-targets" aria-label="관찰할 학생"></div>
          <div id="notice" role="status"></div>
          <div id="ending" role="region" aria-label="시험 결과" hidden></div>
        </div>
        <div id="controls"></div>
      </section>
      <div id="overlay" hidden></div>
    </div>
    <div id="share-toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <dialog id="share-dialog" aria-labelledby="share-title" aria-describedby="share-summary">
      <div class="share-content">
        <header class="share-header">
          <p class="eyebrow">친구에게 도전장 보내기</p>
          <button class="icon-btn share-close" data-share="close" aria-label="공유 안내 닫기">×</button>
          <h2 id="share-title">공유하고 3회 더 받기</h2>
          <p id="share-help"></p>
        </header>
        <figure class="share-preview">
          <img id="share-preview-image" alt="" width="1200" height="630">
          <figcaption><strong id="share-preview-title"></strong><p id="share-summary"></p><span>cat-hunting.vercel.app</span></figcaption>
        </figure>
        <div id="share-manual" hidden>
          <label for="share-url">게임 링크</label>
          <input id="share-url" type="url" readonly spellcheck="false">
        </div>
        <p id="share-status" role="status" aria-live="polite"></p>
        <button class="primary" data-share="send">공유하기</button>
        <button class="secondary" data-share="copy" hidden>링크 다시 복사</button>
      </div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
