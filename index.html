<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta
      name="description"
      content="90초 동안 부정행위자 세 명을 찾는 모바일 3D 시험 감독 게임, 냥이잡기."
    />
    <link rel="icon" type="image/svg+xml" href="/cat.svg" />
    <title>냥이잡기</title>
  </head>
  <body>
    <div id="game">
      <main id="lobby"></main>
      <section id="play" aria-label="시험 감독" hidden>
        <div id="play-header"></div>
        <div id="viewfinder">
          <canvas id="room" aria-label="3D 시험실"></canvas>
          <div id="seat-targets" aria-label="관찰할 학생"></div>
          <div id="tasks" aria-label="학생 요청"></div>
          <div id="notice" role="status"></div>
          <div id="ending" hidden></div>
        </div>
        <div id="controls"></div>
      </section>
      <div id="overlay" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
